<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            background-color: #000000; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s;
        }

        #ascii-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            margin: 2rem;
        }

        #ascii-grid {
            font-family: 'Courier New', monospace;
            white-space: pre;
            line-height: 0.8; 
            font-size: 0.9rem;
            overflow: visible; 
            padding: 0; 
            background-color: transparent; 
            border-radius: 0;
            box-shadow: none; 
            margin: 0 auto; 
            max-width: fit-content;
            transition: box-shadow 0.3s;
        }

        #theme-toggle {
            padding: 0.5rem 1rem;
            border: 2px solid;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            background: transparent;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.25rem;
        }
        
        #theme-toggle svg {
            width: 20px;
            height: 20px;
            transition: stroke 0.3s;
        }

        #theme-toggle.dark-mode {
            color: #ffffff;
            border-color: #ffffff;
        }
        #theme-toggle.dark-mode svg { stroke: #ffffff; }
        #theme-toggle.dark-mode:hover { background: rgba(255, 255, 255, 0.1); }

        #theme-toggle.light-mode {
            color: #000000;
            border-color: #000000;
        }
        #theme-toggle.light-mode svg { stroke: #000000; }
        #theme-toggle.light-mode:hover { background: rgba(0, 0, 0, 0.1); }

        #text-input {
            margin-top: 1rem;
            padding: 0.5rem 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            background: transparent;
            border: 2px solid;
            border-radius: 0.5rem;
            text-align: center;
            width: 16rem;
            max-width: 80vw;
            outline: none;
            transition: all 0.3s;
        }

        #text-input.dark-mode {
            color: #ffffff;
            border-color: #ffffff;
        }
        #text-input.dark-mode::placeholder { color: rgba(255, 255, 255, 0.4); }

        #text-input.light-mode {
            color: #000000;
            border-color: #000000;
        }
        #text-input.light-mode::placeholder { color: rgba(0, 0, 0, 0.4); }

        #save-gif {
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            border: 2px solid;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: transparent;
            transition: all 0.3s;
        }
        #save-gif:disabled { cursor: progress; opacity: 0.6; }

        #save-gif.dark-mode { color: #ffffff; border-color: #ffffff; }
        #save-gif.dark-mode:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
        #save-gif.light-mode { color: #000000; border-color: #000000; }
        #save-gif.light-mode:hover:not(:disabled) { background: rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="ascii-container">
        <button id="theme-toggle" aria-label="Toggle theme"></button>
        <div id="ascii-grid"></div>
        <input id="text-input" type="text" maxlength="40" placeholder="type your text..." />
        <button id="save-gif">save as gif</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <script>
        window.onload = function () {
            const GRID_SIZE = 60;
            const X_MIN = -3.2;
            const X_MAX = 3.2;
            const Y_MIN = -5.5;
            const Y_MAX = 5.5;

            const STEP_X = (X_MAX - X_MIN) / GRID_SIZE;
            const STEP_Y = (Y_MAX - Y_MIN) / GRID_SIZE;

            const DEFAULT_TEXT = 'type your text  ∗ ';
            const SEPARATOR = ' ∗ '; // shown between repeats so words don't run together
            let TEXT = DEFAULT_TEXT;
            const SCROLL_SPEED = 4; // characters per second
            const EMPTY_CHAR = ' ';

            // Pre-generate a grid of random hues that stay fixed per cell
            const hueGrid = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                hueGrid[i] = [];
                for (let j = 0; j < GRID_SIZE; j++) {
                    hueGrid[i][j] = Math.floor(Math.random() * 360);
                }
            }

            let charOffset = 0;
            let lastTime = null;
            let isDarkMode = true;

            const bodyElement = document.body;
            const gridElement = document.getElementById('ascii-grid');
            const toggleButton = document.getElementById('theme-toggle');
            const textInput = document.getElementById('text-input');
            const saveGifButton = document.getElementById('save-gif');

            const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
            const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

            function getMaxY(x) {
                const y_circle = Math.sqrt(9 - x * x);
                if (Math.abs(x) < 1.69257) return 3;
                return isNaN(y_circle) ? -Infinity : y_circle;
            }

            function getMinY(x) {
                const y_circle = -Math.sqrt(9 - x * x);
                if (Math.abs(x) < 0.99336) return -3.1;
                return isNaN(y_circle) ? +Infinity : y_circle;
            }

            function updateThemeAppearance() {
                if (isDarkMode) {
                    bodyElement.style.backgroundColor = '#000000';
                    toggleButton.innerHTML = sunIcon;
                    toggleButton.classList.remove('light-mode');
                    toggleButton.classList.add('dark-mode');
                    toggleButton.setAttribute('aria-label', 'Switch to Light Mode');
                    textInput.classList.remove('light-mode');
                    textInput.classList.add('dark-mode');
                    saveGifButton.classList.remove('light-mode');
                    saveGifButton.classList.add('dark-mode');
                } else {
                    bodyElement.style.backgroundColor = '#ffffff';
                    toggleButton.innerHTML = moonIcon;
                    toggleButton.classList.remove('dark-mode');
                    toggleButton.classList.add('light-mode');
                    toggleButton.setAttribute('aria-label', 'Switch to Dark Mode');
                    textInput.classList.remove('dark-mode');
                    textInput.classList.add('light-mode');
                    saveGifButton.classList.remove('dark-mode');
                    saveGifButton.classList.add('light-mode');
                }
            }

            toggleButton.addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                updateThemeAppearance();
            });

            textInput.addEventListener('input', () => {
                const v = textInput.value.trim();
                // Fall back to the default so the jar is never empty
                TEXT = v.length > 0 ? v + SEPARATOR : DEFAULT_TEXT;
            });

            updateThemeAppearance();

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                const delta = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                charOffset = (charOffset + SCROLL_SPEED * delta) % TEXT.length;
                const offset = Math.floor(charOffset);

                const lightness = isDarkMode ? '65%' : '40%';

                // Build HTML with colored spans
                let html = '';
                for (let i = 0; i < GRID_SIZE; i++) {
                    const y_grid = Y_MAX - i * STEP_Y - (STEP_Y / 2);

                    for (let j = 0; j < GRID_SIZE; j++) {
                        const x_grid = X_MIN + j * STEP_X + (STEP_X / 2);
                        const y_max = getMaxY(x_grid);
                        const y_min = getMinY(x_grid);

                        if (y_grid <= y_max && y_grid >= y_min) {
                            const charIndex = (j + offset) % TEXT.length;
                            const ch = TEXT[charIndex];
                            const hue = hueGrid[i][j];
                            const color = `hsl(${hue}, 100%, ${lightness})`;
                            html += `<span style="color:${color}">${ch}</span>`;
                        } else {
                            html += EMPTY_CHAR;
                        }
                    }
                    html += '\n';
                }

                gridElement.innerHTML = html.slice(0, -1);
                requestAnimationFrame(animate);
            }

            // ---- GIF export ----
            // Draw a single frame (one integer scroll offset) onto a canvas,
            // mirroring the on-screen jar geometry and colors exactly.
            function renderFrameToCanvas(offset, text) {
                const fontSize = 16;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const font = `${fontSize}px 'Courier New', monospace`;

                ctx.font = font;
                const cellW = ctx.measureText('M').width; // monospace: every char same width
                const cellH = fontSize;                   // line-height: 1, like the page

                canvas.width = Math.ceil(GRID_SIZE * cellW);
                canvas.height = Math.ceil(GRID_SIZE * cellH);

                // Re-apply font (resizing the canvas resets the context)
                ctx.font = font;
                ctx.textBaseline = 'top';
                ctx.textAlign = 'left';

                // Solid background matching the current theme
                ctx.fillStyle = isDarkMode ? '#000000' : '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const lightness = isDarkMode ? '65%' : '40%';

                for (let i = 0; i < GRID_SIZE; i++) {
                    const y_grid = Y_MAX - i * STEP_Y - (STEP_Y / 2);
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const x_grid = X_MIN + j * STEP_X + (STEP_X / 2);
                        if (y_grid <= getMaxY(x_grid) && y_grid >= getMinY(x_grid)) {
                            const ch = text[(j + offset) % text.length];
                            ctx.fillStyle = `hsl(${hueGrid[i][j]}, 100%, ${lightness})`;
                            ctx.fillText(ch, j * cellW, i * cellH);
                        }
                    }
                }
                return canvas;
            }

            // Resolve the encoder's worker script as a same-origin blob URL,
            // which avoids cross-origin worker restrictions on some browsers.
            async function getWorkerUrl() {
                const cdn = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
                try {
                    const blob = await (await fetch(cdn)).blob();
                    return URL.createObjectURL(blob);
                } catch (e) {
                    return cdn; // fall back to the direct URL
                }
            }

            saveGifButton.addEventListener('click', async () => {
                if (typeof GIF === 'undefined') {
                    alert('GIF library failed to load. Check your internet connection.');
                    return;
                }

                const text = TEXT;                       // snapshot the current text
                const frameDelay = 1000 / SCROLL_SPEED;  // ms per character step
                const originalLabel = saveGifButton.textContent;
                saveGifButton.disabled = true;
                saveGifButton.textContent = 'preparing...';

                const workerScript = await getWorkerUrl();
                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    repeat: 0, // loop forever
                    workerScript: workerScript,
                    background: isDarkMode ? '#000000' : '#ffffff'
                });

                // One full loop = one frame per character in the string
                for (let offset = 0; offset < text.length; offset++) {
                    const frame = renderFrameToCanvas(offset, text);
                    gif.addFrame(frame, { delay: frameDelay, copy: true });
                }

                gif.on('progress', (p) => {
                    saveGifButton.textContent = `rendering ${Math.round(p * 100)}%`;
                });

                gif.on('finished', (blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'temporary-temple.gif';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    saveGifButton.disabled = false;
                    saveGifButton.textContent = originalLabel;
                });

                gif.render();
            });

            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
